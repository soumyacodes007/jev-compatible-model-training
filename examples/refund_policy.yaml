# A dataset served by the example plugin source (no Hugging Face involved).
#   jevkit --plugins examples.plugins.refund_policy data preview examples/refund_policy.yaml
name: refund_policy
description: Synthetic refund decisions from a rule, generated by a plugin source.

source:
  type: refund_policy            # registered in examples/plugins/refund_policy.py
  kwargs: {n_train: 600, n_test: 120, seed: 7}
  train_splits: [train]
  test_splits: [test]
  # The same function also works without registering a source:
  #   type: python
  #   function: examples.plugins.refund_policy:generate

task:
  kind: choice
  state:
    days_since_purchase: days_since_purchase
    item_opened: item_opened
    amount_usd: amount_usd
  question: >-
    Policy: refunds after 30 days are denied; orders over $500 are escalated;
    unopened items get a full refund and opened items a partial one.
    What should happen to this request?
  label: label
  options:
    approve: Approve a full refund.
    partial: Approve a partial refund.
    deny: Deny the refund.
    escalate: Escalate to a human reviewer.

sample: {train: 400, dev: 50, test: 100}
